createFeatureFlag:
  post:
    tags:
      - Feature Flags
    summary: Create feature flag
    security:
      - BearerAuth: []
    parameters:
      - in: path
        name: environmentId
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/feature-flag.yaml#/CreateFeatureFlagRequest'
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: '../schemas/feature-flag.yaml#/FeatureFlag'
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: '../schemas/errors.yaml#/ErrorResponse'

featureFlagById:
  get:
    tags:
      - Feature Flags
    summary: Get feature flag
    security:
      - BearerAuth: []
    parameters:
      - in: path
        name: flagId
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Found
        content:
          application/json:
            schema:
              $ref: '../schemas/feature-flag.yaml#/FeatureFlag'
      '404':
        description: Flag not found
        content:
          application/json:
            schema:
              $ref: '../schemas/errors.yaml#/ErrorResponse'

  put:
    tags:
      - Feature Flags
    summary: Update feature flag
    security:
      - BearerAuth: []
    parameters:
      - in: path
        name: flagId
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/feature-flag.yaml#/UpdateFeatureFlagRequest'
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema:
              $ref: '../schemas/feature-flag.yaml#/FeatureFlag'
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: '../schemas/errors.yaml#/ErrorResponse'
      '404':
        description: Flag not found
        content:
          application/json:
            schema:
              $ref: '../schemas/errors.yaml#/ErrorResponse'

